spring.application.name=iceibank-agency-${AGENCY_ID:0}
server.port=${SERVER_PORT:8080}

bank.agency-id=${AGENCY_ID:0}
bank.agencies[0]=${AGENCY_0_URL:http://localhost:8080}
bank.agencies[1]=${AGENCY_1_URL:http://localhost:8081}
bank.agencies[2]=${AGENCY_2_URL:http://localhost:8082}
bank.event-directory=${EVENT_DIRECTORY:./data}
bank.internal-api-key=${INTERNAL_API_KEY:ICEIBankInternalAgencyKey2026}

spring.datasource.url=jdbc:h2:file:./data/iceibank-agency-${AGENCY_ID:0};AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

security.jwt.secret=${JWT_SECRET:ICEIBankSprintOneSecretKeyWithAtLeastThirtyTwoBytes}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

spring.jackson.serialization.write-dates-as-timestamps=false

# AUTO acknowledges only after the transactional listener returns successfully.
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.max-interval=2s
